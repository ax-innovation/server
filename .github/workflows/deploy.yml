- name: 7. EC2에서 구버전 종료 및 새 버전 실행
    uses: appleboy/ssh-action@master
    with:
      host: ${{ secrets.EC2_HOST }}
      username: ${{ secrets.EC2_USERNAME }}
      key: ${{ secrets.EC2_SSH_KEY }}
      script: |
        cd /home/${{ secrets.EC2_USERNAME }}/finapi
        
        # 1) 현재 실행 중인 Java 프로세스만 정확히 찾아서 끄기 (자살 방지 필터 적용)
        CURRENT_PID=$(ps -ef | grep java | grep finapi-0.0.1-SNAPSHOT.jar | grep -v grep | awk '{print $2}')
        
        if [ -z "$CURRENT_PID" ]; then
          echo "현재 실행 중인 애플리케이션이 없습니다."
        else
          echo "Kill process $CURRENT_PID"
          kill -9 $CURRENT_PID
          sleep 3
        fi
        
        # 2) 새로 전송받은 파일로 서버 켜기 (입출력 완전히 분리하여 백그라운드 실행)
        echo "Deploying new version..."
        nohup java -jar finapi-0.0.1-SNAPSHOT.jar > application.log 2>&1 < /dev/null &