name: Deploy to Amazon EC2 with Amazon RDS

on:
  push:
    branches:
      - main # main 브랜치에 코드가 push될 때 이 스크립트가 실행됩니다.

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 체크아웃
        uses: actions/checkout@v3

      - name: 2. JDK 17 설정
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: 3. application.yml 동적 생성 (RDS 연결 정보 주입)
        run: |
          mkdir -p src/main/resources
          cat <<EOF > src/main/resources/application.yml
          spring:
            datasource:
              url: jdbc:mysql://${{ secrets.RDS_HOST }}:3306/findb?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
              username: ${{ secrets.DB_USERNAME }}
              password: ${{ secrets.DB_PASSWORD }}
              driver-class-name: com.mysql.cj.jdbc.Driver
            jpa:
              hibernate:
                ddl-auto: none
              show-sql: true
              properties:
                hibernate:
                  format_sql: true
                  dialect: org.hibernate.dialect.MySQLDialect
          server:
            port: 8080
          EOF

      - name: 4. Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 5. 프로젝트 빌드 (테스트 제외)
        run: ./gradlew clean build -x test

      - name: 6. EC2로 빌드된 JAR 파일 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/finapi-0.0.1-SNAPSHOT.jar"
          target: "/home/${{ secrets.EC2_USERNAME }}/finapi"
          strip_components: 2

      - name: 7. EC2에서 구버전 종료 및 새 버전 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/finapi
            
            # 1) 현재 실행 중인 서버 끄기
            CURRENT_PID=$(pgrep -f finapi-0.0.1-SNAPSHOT.jar)
            if [ -z "$CURRENT_PID" ]; then
              echo "현재 실행 중인 애플리케이션이 없습니다."
            else
              echo "Kill process $CURRENT_PID"
              kill -9 $CURRENT_PID
              sleep 3
            fi
            
            # 2) 새로 전송받은 파일로 서버 켜기 (백그라운드)
            echo "Deploying new version..."
            nohup java -jar finapi-0.0.1-SNAPSHOT.jar > application.log 2>&1 &