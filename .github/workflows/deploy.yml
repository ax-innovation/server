name: Deploy to Amazon EC2 with Amazon RDS
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Create application.yml
        run: |
          mkdir -p src/main/resources
          cat <<EOF > src/main/resources/application.yml
          spring:
            datasource:
              url: jdbc:mysql://${{ secrets.RDS_HOST }}:3306/findb?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
              username: ${{ secrets.DB_USERNAME }}
              password: ${{ secrets.DB_PASSWORD }}
              driver-class-name: com.mysql.cj.jdbc.Driver
            jpa:
              hibernate:
                ddl-auto: none
              show-sql: true
              properties:
                hibernate:
                  format_sql: true
                  dialect: org.hibernate.dialect.MySQLDialect
          server:
            port: 8080
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Transfer JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/finapi-0.0.1-SNAPSHOT.jar"
          target: "/home/${{ secrets.EC2_USERNAME }}/finapi"
          strip_components: 2

      - name: Execute on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/finapi
            
            CURRENT_PID=$(ps -ef | grep java | grep finapi-0.0.1-SNAPSHOT.jar | grep -v grep | awk '{print $2}')
            
            if [ -z "$CURRENT_PID" ]; then
              echo "No running application found."
            else
              echo "Kill process $CURRENT_PID"
              kill -9 $CURRENT_PID
              sleep 3
            fi
            
            echo "Deploying new version..."
            nohup java -jar finapi-0.0.1-SNAPSHOT.jar > application.log 2>&1 < /dev/null &